<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الأخبار التي حفظتها للقراءة لاحقًا">
    <title>المحفوظات - Pixel News</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/pixel.png" type="image/png">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo"><a href="index.html" aria-label="Pixel News"><img src="img/pixel.png" alt="شعار Pixel News" class="logo-image"></a></div>
            <nav class="main-nav" aria-label="التنقل الرئيسي"><ul></ul></nav>
            <div class="header-right-controls">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="saved-page" aria-labelledby="saved-page-title">
            <span class="section-kicker">مكتبتك الشخصية</span>
            <h1 id="saved-page-title">المحفوظات</h1>
            <p id="saved-articles-status" class="saved-page-status" role="status" aria-live="polite">جارٍ تحميل المحفوظات...</p>
            <div id="saved-articles-grid" class="articles-grid saved-articles-grid" hidden></div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2026 - منصة ظاهر الإعلامية</p></div></div>
    </footer>
    <script src="articles-data.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
