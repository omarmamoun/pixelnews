<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Pixel News</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-brand" href="../index.html">
            <span class="auth-brand-mark"><i class="fas fa-newspaper" aria-hidden="true"></i></span>
        </a>
        <section class="auth-card" aria-labelledby="auth-title">
            <div class="auth-heading">
                <span class="eyebrow">حسابك في Pixel News</span>
                <h1 id="auth-title">ابقَ قريبًا من الخبر</h1>
                <p>أنشئ حسابًا لتصلك إشعارات الأخبار الجديدة وتتابع آخر التغطيات.</p>
            </div>
            <div class="auth-tabs" role="tablist" aria-label="نوع العملية">
                <button class="auth-tab active" type="button" data-auth-tab="login">تسجيل الدخول</button>
                <button class="auth-tab" type="button" data-auth-tab="register">إنشاء حساب</button>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group"><label for="login-email">البريد الإلكتروني</label><input id="login-email" type="email" autocomplete="email" required></div>
                <div class="form-group"><label for="login-password">كلمة المرور</label><input id="login-password" type="password" autocomplete="current-password" minlength="8" required></div>
                <button class="submit-btn auth-submit" type="submit"><i class="fas fa-right-to-bracket" aria-hidden="true"></i> دخول</button>
                <button id="forgot-password" class="auth-text-button" type="button">نسيت كلمة المرور؟</button>
            </form>
            <form id="reset-form" class="auth-form" hidden>
                <div class="form-group"><label for="reset-email">البريد الإلكتروني</label><input id="reset-email" type="email" autocomplete="email" required></div>
                <div class="form-group"><label for="reset-token">رمز الاسترجاع</label><input id="reset-token" type="text" autocomplete="one-time-code" minlength="32" required></div>
                <div class="form-group"><label for="reset-password">كلمة المرور الجديدة</label><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required></div>
                <div class="form-group"><label for="reset-password-confirm">تأكيد كلمة المرور</label><input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
                <button class="submit-btn auth-submit" type="submit"><i class="fas fa-key" aria-hidden="true"></i> تغيير كلمة المرور</button>
                <button id="request-reset" class="outline-button auth-submit" type="button"><i class="fas fa-envelope" aria-hidden="true"></i> إرسال رمز جديد</button>
                <button id="back-to-login" class="auth-text-button" type="button">العودة لتسجيل الدخول</button>
            </form>
            <form id="register-form" class="auth-form" hidden>
                <div class="form-group"><label for="register-name">الاسم الكامل</label><input id="register-name" type="text" autocomplete="name" minlength="2" required></div>
                <div class="form-group"><label for="register-email">البريد الإلكتروني</label><input id="register-email" type="email" autocomplete="email" required></div>
                <div class="form-group"><label for="register-password">كلمة المرور</label><input id="register-password" type="password" autocomplete="new-password" minlength="8" required></div>
                <label class="auth-check"><input id="register-notifications" type="checkbox" checked> أرسل لي تنبيهًا عند نشر أخبار جديدة</label>
                <button class="submit-btn auth-submit" type="submit"><i class="fas fa-user-plus" aria-hidden="true"></i> إنشاء الحساب</button>
            </form>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
            <a class="auth-back-link" href="../index.html">العودة إلى الأخبار</a>
        </section>
    </main>
    <script src="../articles-data.js" defer></script>
    <script src="../script.js" defer></script>
</body>
</html>
